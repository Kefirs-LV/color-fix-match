<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorFix Match</title>

<style>
:root {
  --bg: #f2f4f8;
  --card: #ffffff;
  --primary: #2563eb;
  --text: #1f2937;
  --muted: #6b7280;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 16px;
}

.header {
  text-align: center;
  margin-bottom: 16px;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  margin-bottom: 16px;
}

.buttons {
  display: flex;
  gap: 12px;
}

button {
  flex: 1;
  padding: 14px;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  background: var(--primary);
  color: white;
  cursor: pointer;
}

button.secondary {
  background: #111827;
}

input[type="file"] {
  display: none;
}

#canvasContainer {
  position: relative;
  margin-top: 12px;
}

canvas {
  width: 100%;
  border-radius: 12px;
  display: block;
}

#sampleCircle {
  position: absolute;
  width: 22px;
  height: 22px;
  border: 2px solid white;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px rgba(0,0,0,0.6);
  display: none;
  z-index: 10;
}

#removeBtn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.7);
  color: white;
  border: none;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  padding: 0;
  line-height: 1;
}

.result {
  display: flex;
  align-items: center;
  gap: 12px;
}

.color-preview {
  width: 50px;
  height: 50px;
  border-radius: 12px;
  border: 1px solid #ddd;
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <h1>ColorFix Match</h1>
    <p>Atrodi RGB, RAL un Caparol kodu</p>
  </div>

  <div class="card">
    <div class="buttons">
      <button onclick="galleryInput.click()">📂 Izvēlēties</button>
      <button class="secondary" onclick="cameraInput.click()">📸 Kamera</button>
    </div>

    <input id="galleryInput" type="file" accept="image/*">
    <input id="cameraInput" type="file" accept="image/*" capture="environment">

    <div id="canvasContainer">
      <canvas id="canvas"></canvas>
      <div id="sampleCircle"></div>
      <button id="removeBtn">✕</button>
    </div>
  </div>

  <div class="card">
    <div class="result">
      <div class="color-preview" id="colorPreview"></div>
      <div>
        <strong id="rgbText">RGB: —</strong><br>
        <span id="hexText">HEX: —</span><br>
        <span id="ralText">RAL: —</span><br>
        <span id="caparolText">Caparol: —</span>
      </div>
    </div>
  </div>

</div>

<script>
let ralColors = [];
let caparolColors = [];

// Ielādējam abus datu failus
fetch('ral.json').then(r=>r.json()).then(d=>ralColors=d).catch(e=>console.log("Nav ral.json"));
fetch('caparol.json').then(r=>r.json()).then(d=>caparolColors=d).catch(e=>console.log("Nav caparol.json"));

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const sampleCircle = document.getElementById('sampleCircle');
const preview = document.getElementById('colorPreview');
const rgbText = document.getElementById('rgbText');
const hexText = document.getElementById('hexText');
const ralText = document.getElementById('ralText');
const caparolText = document.getElementById('caparolText');
const removeBtn = document.getElementById('removeBtn');

const galleryInput = document.getElementById('galleryInput');
const cameraInput = document.getElementById('cameraInput');

let img = new Image();

galleryInput.onchange = cameraInput.onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  img.src = URL.createObjectURL(file);
};

img.onload = () => {
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);
  sampleCircle.style.display = "none";
  removeBtn.style.display = "flex";
};

removeBtn.onclick = () => {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  canvas.width = 0;
  canvas.height = 0;
  sampleCircle.style.display = "none";
  removeBtn.style.display = "none";
  rgbText.textContent = "RGB: —";
  hexText.textContent = "HEX: —";
  ralText.textContent = "RAL: —";
  caparolText.textContent = "Caparol: —";
  preview.style.background = "transparent";
};

canvas.addEventListener('click', pick);

function pick(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  sampleCircle.style.left = (e.clientX - rect.left)+'px';
  sampleCircle.style.top = (e.clientY - rect.top)+'px';
  sampleCircle.style.display = "block";

  const size = 5;
  const offset = Math.floor(size / 2);
  const data = ctx.getImageData(x - offset, y - offset, size, size).data;
  
  let r = 0, g = 0, b = 0, count = 0;

  for (let i = 0; i < data.length; i += 4) {
    r += data[i];
    g += data[i + 1];
    b += data[i + 2];
    count++;
  }

  r = Math.round(r / count);
  g = Math.round(g / count);
  b = Math.round(b / count);

  const hex = '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1).toUpperCase();

  preview.style.background = hex;
  rgbText.textContent = `RGB: ${r}, ${g}, ${b}`;
  hexText.textContent = `HEX: ${hex}`;
  ralText.textContent = `RAL: ${closestRAL(r,g,b)}`;
  caparolText.textContent = `Caparol: ${closestCaparol(r,g,b)}`;
}

function closestRAL(r,g,b){
  if(ralColors.length === 0) return 'Dati nav ielādēti';
  let best='—',dist=1e9;
  ralColors.forEach(c=>{
    const d=(r-c.r)**2+(g-c.g)**2+(b-c.b)**2;
    if(d<dist){dist=d;best=c.name;}
  });
  return best;
}

function closestCaparol(r,g,b){
  if(caparolColors.length === 0) return 'Dati nav ielādēti (vajag caparol.json)';
  let best='—',dist=1e9;
  caparolColors.forEach(c=>{
    const d=(r-c.r)**2+(g-c.g)**2+(b-c.b)**2;
    if(d<dist){dist=d;best=c.name;}
  });
  return best;
}
</script>

</body>
</html>
